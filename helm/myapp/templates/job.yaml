{{/*
A Job, not a Deployment: the app prints its message and exits, which a Deployment
would treat as a crash (CrashLoopBackOff). Job specs are immutable, so the name
includes the release revision - each `helm upgrade` creates a fresh Job and Helm
removes the previous one.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "myapp.fullname" . }}-{{ .Release.Revision }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- with .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "myapp.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "myapp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The JVM writes to /tmp; needed because the root filesystem is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
